<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>PapaStreams</title>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="442" y2="442">
      <stop offset="0" stop-color="#E91E63"/>
      <stop offset="1" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  <!-- outer: a record/stream ring, open at the top right like a signal -->
